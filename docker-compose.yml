
services:
  frontend:
    build:
      context: ./frontend
    container_name: taskflow-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - taskflow-network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: taskflow-backend
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - taskflow-network
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: taskflow-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: taskflow_db
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d taskflow_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - taskflow-network
    restart: unless-stopped

volumes:
  postgres-data:

networks:
  taskflow-network:
    driver: bridge
